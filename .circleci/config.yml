version: 2.1
orbs:
  docker: circleci/docker@2.8.0

jobs:

  deploy-docker-build:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - run:
          name: Checkout (HTTPS, public repo)
          command: |
            git clone "https://github.com/suculent/mongoose-docker-build.git" .
            git checkout "${CIRCLE_SHA1}" || echo "SHA not found; using default branch"
      - docker/check
      # The base image (dhi.io/debian-base) is a Docker Hardened Image. dhi.io
      # refuses anonymous pulls even for publicly entitled repositories -- the
      # build dies with `401 Unauthorized` on
      # `GET https://dhi.io/token?scope=repository:debian-base:pull` at "load
      # metadata" -- so the builder has to authenticate there as well as to
      # Docker Hub. DHI is gated on Docker Hub accounts, so the same
      # dockerhub-context credentials apply. Same step as in
      # arduino-docker-build, which hit this first.
      - docker/check:
          registry: dhi.io
      - docker/build:
          image: suculent/mongoose-docker-build
          tag: latest
      - docker/push:
          digest-path: /tmp/digest.txt
          image: suculent/mongoose-docker-build
          tag: latest
      - run:
          command: |
            echo "Digest is: $(</tmp/digest.txt)"
            docker tag $(</tmp/digest.txt) suculent/mongoose-docker-build:latest

#
# WORKFLOWS
#

workflows:

  build:
    jobs:
      - deploy-docker-build:
          context:
            - dockerhub
          filters:
            branches:
              only: master